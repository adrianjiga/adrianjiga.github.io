<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Web Tables</title>
  <link rel="stylesheet" href="css/webtables.css" />
</head>
<body>
  <h1>Web Tables</h1>

  <div class="toolbar" data-cy="toolbar">
    <input
      type="text"
      id="searchBox"
      data-cy="searchBox"
      placeholder="Type to search..."
      aria-label="Search records"
    />
    <button id="addNewRecordButton" data-cy="addRecordBtn">+ Add</button>
  </div>

  <div class="table-wrapper" data-cy="tableWrapper">
    <table data-cy="table">
      <thead data-cy="tableHeader">
        <tr>
          <th scope="col">First Name</th>
          <th scope="col">Last Name</th>
          <th scope="col">Age</th>
          <th scope="col">Email</th>
          <th scope="col">Salary</th>
          <th scope="col">Department</th>
          <th scope="col">Actions</th>
        </tr>
      </thead>
      <tbody id="tableBody" data-cy="tableBody"></tbody>
    </table>
  </div>

  <div class="pagination-bar" data-cy="pagination">
    <button class="pagination-btn" data-cy="prevPageBtn">Previous</button>
    <div class="page-info" data-cy="pageInfo">
      <span>Page</span>
      <strong id="currentPageNum" data-cy="currentPage">1</strong>
      <span>of</span>
      <span id="totalPagesDisplay" data-cy="totalPages">1</span>
    </div>
    <button class="pagination-btn" data-cy="nextPageBtn">Next</button>
    <div class="rows-per-page">
      <label for="rowsPerPageSel">Rows per page:</label>
      <select
        id="rowsPerPageSel"
        data-cy="rowsPerPageSelect"
      >
        <option value="5">5 rows</option>
        <option value="10" selected>10 rows</option>
        <option value="20">20 rows</option>
        <option value="25">25 rows</option>
        <option value="50">50 rows</option>
        <option value="100">100 rows</option>
      </select>
    </div>
  </div>

  <script src="js/webtables.js"></script>
</body>
</html>
