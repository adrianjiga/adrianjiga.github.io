<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Buttons</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 30px;
      color: #333;
    }
    h1 { font-size: 1.5rem; margin-bottom: 8px; }
    .mt-4 { margin-top: 1.5rem; }
    button {
      padding: 8px 20px;
      font-size: 14px;
      cursor: pointer;
      border: 1px solid #adb5bd;
      border-radius: 4px;
      background: #fff;
      transition: background 0.15s;
    }
    button:hover { background: #f1f3f5; }
    #doubleClickMessage,
    #rightClickMessage,
    #dynamicClickMessage {
      display: none;
      color: #28a745;
      margin-top: 8px;
      font-weight: 500;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <h1>Buttons</h1>

  <!--
    The selector used by the Cypress test for the dynamic click button is:
      div.mt-4:nth-child(4) button
    That means the 4th child of the parent container must be a div.mt-4 containing a button.
    Structure below: parent div has exactly 4 div.mt-4 children; the 4th holds the dynamic button.
  -->
  <div id="buttons-wrapper">
    <!-- child 1 -->
    <div class="mt-4">
      <button id="doubleClickBtn" ondblclick="show('doubleClickMessage')">Double Click Me</button>
      <p id="doubleClickMessage">You have done a double click</p>
    </div>

    <!-- child 2 -->
    <div class="mt-4">
      <button id="rightClickBtn" oncontextmenu="show('rightClickMessage'); return false;">Right Click Me</button>
      <p id="rightClickMessage">You have done a right click</p>
    </div>

    <!-- child 3: dynamic click message lives here so it can render near the top -->
    <div class="mt-4">
      <p id="dynamicClickMessage">You have done a dynamic click</p>
    </div>

    <!-- child 4: div.mt-4:nth-child(4) button targets this button -->
    <div class="mt-4">
      <button onclick="show('dynamicClickMessage')">Click Me</button>
    </div>
  </div>

  <script>
    function show(id) {
      document.getElementById(id).style.display = "block";
    }
  </script>
</body>
</html>
