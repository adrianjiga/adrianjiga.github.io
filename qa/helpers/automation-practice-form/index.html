<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Automation Practice Form</title>
  <link rel="stylesheet" href="css/form.css" />
</head>
<body>
  <h1>Automation Practice Form</h1>

  <form data-cy="practiceForm">

    <div class="twoCol">
      <div class="formGroup">
        <label class="fieldLabel" for="firstName">First Name</label>
        <input type="text" id="firstName" data-cy="firstNameInput" placeholder="First Name" />
      </div>
      <div class="formGroup">
        <label class="fieldLabel" for="lastName">Last Name</label>
        <input type="text" id="lastName" data-cy="lastNameInput" placeholder="Last Name" />
      </div>
    </div>

    <div class="formGroup">
      <label class="fieldLabel" for="userEmail">Email</label>
      <input type="email" id="userEmail" data-cy="emailInput" placeholder="name@example.com" />
    </div>

    <div class="formGroup">
      <label class="fieldLabel">Gender</label>
      <div class="genderGroup" data-cy="genderGroup">
        <input type="radio" id="genderRadio1" name="gender" value="Male"   data-cy="genderMale"   />
        <label for="genderRadio1" data-cy="genderMaleLabel">Male</label>
        <input type="radio" id="genderRadio2" name="gender" value="Female" data-cy="genderFemale" />
        <label for="genderRadio2" data-cy="genderFemaleLabel">Female</label>
        <input type="radio" id="genderRadio3" name="gender" value="Other"  data-cy="genderOther"  />
        <label for="genderRadio3" data-cy="genderOtherLabel">Other</label>
      </div>
    </div>

    <div class="formGroup">
      <label class="fieldLabel" for="userNumber">Mobile</label>
      <input type="text" id="userNumber" data-cy="mobileInput" placeholder="Mobile Number" />
    </div>

    <div class="formGroup">
      <label class="fieldLabel" for="dateOfBirthInput">Date of Birth</label>
      <div class="datePickerWrapper">
        <input
          type="text"
          id="dateOfBirthInput"
          data-cy="dateOfBirthInput"
          placeholder="Date of Birth"
          readonly
        />
        <div id="datepickerPopup" data-cy="datepickerPopup" style="display:none;">
          <div class="datePickerHeader">
            <select id="dpMonth" data-cy="monthSelect" aria-label="Month">
              <option value="0">January</option>
              <option value="1">February</option>
              <option value="2">March</option>
              <option value="3">April</option>
              <option value="4">May</option>
              <option value="5">June</option>
              <option value="6">July</option>
              <option value="7">August</option>
              <option value="8">September</option>
              <option value="9">October</option>
              <option value="10">November</option>
              <option value="11">December</option>
            </select>
            <select id="dpYear" data-cy="yearSelect" aria-label="Year">
              <!-- populated by DatePicker.init() -->
            </select>
          </div>
          <div class="datePickerGrid" id="dpDaysGrid" data-cy="daysGrid">
            <div class="dayName">Su</div>
            <div class="dayName">Mo</div>
            <div class="dayName">Tu</div>
            <div class="dayName">We</div>
            <div class="dayName">Th</div>
            <div class="dayName">Fr</div>
            <div class="dayName">Sa</div>
            <!-- day cells injected by DatePicker._renderDays() -->
          </div>
        </div>
      </div>
    </div>

    <div class="formGroup">
      <label class="fieldLabel" for="subjectsInput">Subjects</label>
      <div class="subjectsWrapper" data-cy="subjectsWrapper">
        <div id="subjectsChips" data-cy="subjectsChips"></div>
        <input
          type="text"
          id="subjectsInput"
          data-cy="subjectsInput"
          placeholder="Select subjects"
          autocomplete="off"
        />
      </div>
    </div>

    <div class="formGroup">
      <label class="fieldLabel">Hobbies</label>
      <div class="hobbiesGroup" data-cy="hobbiesGroup">
        <label class="hobbyItem" data-cy="hobbySportsLabel">
          <input type="checkbox" id="hobbiesCheckbox1" data-cy="hobbySports"  value="Sports"  /> Sports
        </label>
        <label class="hobbyItem" data-cy="hobbyReadingLabel">
          <input type="checkbox" id="hobbiesCheckbox2" data-cy="hobbyReading" value="Reading" /> Reading
        </label>
        <label class="hobbyItem" data-cy="hobbyMusicLabel">
          <input type="checkbox" id="hobbiesCheckbox3" data-cy="hobbyMusic"   value="Music"   /> Music
        </label>
      </div>
    </div>

    <div class="formGroup">
      <label class="fieldLabel" for="uploadPicture">Picture</label>
      <input type="file" id="uploadPicture" data-cy="uploadPicture" />
    </div>

    <div class="formGroup">
      <label class="fieldLabel" for="currentAddress">Current Address</label>
      <textarea id="currentAddress" data-cy="addressInput" rows="2" placeholder="Current Address"></textarea>
    </div>

    <div class="twoCol">
      <div class="formGroup">
        <label class="fieldLabel">Country</label>
        <div id="state" class="selectDropdown" data-cy="stateDropdown">
          <div class="selectControl" data-cy="stateControl">
            <span id="stateDisplay" data-cy="stateDisplay" class="selectPlaceholder">Select Country</span>
            <span class="selectArrow">&#9660;</span>
          </div>
          <div class="selectMenu" id="stateMenu" data-cy="stateMenu" style="display:none;">
            <div class="selectOption" data-cy="stateOptionGermany"     data-state-idx="0">Germany</div>
            <div class="selectOption" data-cy="stateOptionFrance"      data-state-idx="1">France</div>
            <div class="selectOption" data-cy="stateOptionSpain"       data-state-idx="2">Spain</div>
            <div class="selectOption" data-cy="stateOptionItaly"       data-state-idx="3">Italy</div>
            <div class="selectOption" data-cy="stateOptionNetherlands" data-state-idx="4">Netherlands</div>
          </div>
        </div>
      </div>

      <div class="formGroup">
        <label class="fieldLabel">City</label>
        <div id="city" class="selectDropdown" data-cy="cityDropdown">
          <div class="selectControl" data-cy="cityControl">
            <span id="cityDisplay" data-cy="cityDisplay" class="selectPlaceholder">Select City</span>
            <span class="selectArrow">&#9660;</span>
          </div>
          <div class="selectMenu" id="cityMenu" data-cy="cityMenu" style="display:none;"></div>
        </div>
      </div>
    </div>

    <button type="button" id="submit" data-cy="submitBtn">Submit</button>
  </form>

  <!-- Success modal -->
  <div class="modalOverlay" id="successModal" data-cy="successModal" style="display:none;">
    <div class="modalDialog">
      <div class="modalContent" data-cy="modalContent">
        <div class="modalHeader">
          <h2 data-cy="modalTitle">Thanks for submitting the form</h2>
        </div>
        <div class="modalBody">
          <table data-cy="resultTable">
            <tbody id="resultTbody"></tbody>
          </table>
        </div>
        <div class="modalFooter">
          <button data-cy="closeModalBtn">Close</button>
        </div>
      </div>
    </div>
  </div>

  <script src="js/form.js"></script>
</body>
</html>
