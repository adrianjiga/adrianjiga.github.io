<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Automation Practice Form</title>
  <link rel="stylesheet" href="css/form.css" />
</head>
<body>
  <h1>Automation Practice Form</h1>

  <form data-cy="practiceForm">

    <div class="two-col">
      <div class="form-group">
        <label class="field-label" for="firstName">First Name</label>
        <input type="text" id="firstName" data-cy="firstNameInput" placeholder="First Name" />
      </div>
      <div class="form-group">
        <label class="field-label" for="lastName">Last Name</label>
        <input type="text" id="lastName" data-cy="lastNameInput" placeholder="Last Name" />
      </div>
    </div>

    <div class="form-group">
      <label class="field-label" for="userEmail">Email</label>
      <input type="email" id="userEmail" data-cy="emailInput" placeholder="name@example.com" />
    </div>

    <div class="form-group">
      <label class="field-label">Gender</label>
      <div class="gender-group" data-cy="genderGroup">
        <input type="radio" id="gender-radio-1" name="gender" value="Male"   data-cy="genderMale"   />
        <label for="gender-radio-1" data-cy="genderMaleLabel">Male</label>
        <input type="radio" id="gender-radio-2" name="gender" value="Female" data-cy="genderFemale" />
        <label for="gender-radio-2" data-cy="genderFemaleLabel">Female</label>
        <input type="radio" id="gender-radio-3" name="gender" value="Other"  data-cy="genderOther"  />
        <label for="gender-radio-3" data-cy="genderOtherLabel">Other</label>
      </div>
    </div>

    <div class="form-group">
      <label class="field-label" for="userNumber">Mobile</label>
      <input type="text" id="userNumber" data-cy="mobileInput" placeholder="Mobile Number" />
    </div>

    <div class="form-group">
      <label class="field-label" for="dateOfBirthInput">Date of Birth</label>
      <div class="date-picker-wrapper">
        <input
          type="text"
          id="dateOfBirthInput"
          data-cy="dateOfBirthInput"
          placeholder="Date of Birth"
          readonly
        />
        <div id="datepickerPopup" data-cy="datepickerPopup" style="display:none;">
          <div class="date-picker-header">
            <select id="dp-month" data-cy="monthSelect" aria-label="Month">
              <option value="0">January</option>
              <option value="1">February</option>
              <option value="2">March</option>
              <option value="3">April</option>
              <option value="4">May</option>
              <option value="5">June</option>
              <option value="6">July</option>
              <option value="7">August</option>
              <option value="8">September</option>
              <option value="9">October</option>
              <option value="10">November</option>
              <option value="11">December</option>
            </select>
            <select id="dp-year" data-cy="yearSelect" aria-label="Year">
              <!-- populated by DatePicker.init() -->
            </select>
          </div>
          <div class="date-picker-grid" id="dp-days-grid" data-cy="daysGrid">
            <div class="day-name">Su</div>
            <div class="day-name">Mo</div>
            <div class="day-name">Tu</div>
            <div class="day-name">We</div>
            <div class="day-name">Th</div>
            <div class="day-name">Fr</div>
            <div class="day-name">Sa</div>
            <!-- day cells injected by DatePicker._renderDays() -->
          </div>
        </div>
      </div>
    </div>

    <div class="form-group">
      <label class="field-label" for="subjectsInput">Subjects</label>
      <div class="subjects-wrapper" data-cy="subjectsWrapper">
        <div id="subjects-chips" data-cy="subjectsChips"></div>
        <input
          type="text"
          id="subjectsInput"
          data-cy="subjectsInput"
          placeholder="Select subjects"
          autocomplete="off"
        />
      </div>
    </div>

    <div class="form-group">
      <label class="field-label">Hobbies</label>
      <div class="hobbies-group" data-cy="hobbiesGroup">
        <label class="hobby-item" data-cy="hobbySportsLabel">
          <input type="checkbox" id="hobbies-checkbox-1" data-cy="hobbySports"  value="Sports"  /> Sports
        </label>
        <label class="hobby-item" data-cy="hobbyReadingLabel">
          <input type="checkbox" id="hobbies-checkbox-2" data-cy="hobbyReading" value="Reading" /> Reading
        </label>
        <label class="hobby-item" data-cy="hobbyMusicLabel">
          <input type="checkbox" id="hobbies-checkbox-3" data-cy="hobbyMusic"   value="Music"   /> Music
        </label>
      </div>
    </div>

    <div class="form-group">
      <label class="field-label" for="uploadPicture">Picture</label>
      <input type="file" id="uploadPicture" data-cy="uploadPicture" />
    </div>

    <div class="form-group">
      <label class="field-label" for="currentAddress">Current Address</label>
      <textarea id="currentAddress" data-cy="addressInput" rows="2" placeholder="Current Address"></textarea>
    </div>

    <div class="two-col">
      <div class="form-group">
        <label class="field-label">Country</label>
        <div id="state" class="select-dropdown" data-cy="stateDropdown">
          <div class="select-control" data-cy="stateControl">
            <span id="state-display" data-cy="stateDisplay" class="select-placeholder">Select Country</span>
            <span class="select-arrow">&#9660;</span>
          </div>
          <div class="select-menu" id="state-menu" data-cy="stateMenu" style="display:none;">
            <div class="select-option" data-cy="stateOptionGermany"     data-state-idx="0">Germany</div>
            <div class="select-option" data-cy="stateOptionFrance"      data-state-idx="1">France</div>
            <div class="select-option" data-cy="stateOptionSpain"       data-state-idx="2">Spain</div>
            <div class="select-option" data-cy="stateOptionItaly"       data-state-idx="3">Italy</div>
            <div class="select-option" data-cy="stateOptionNetherlands" data-state-idx="4">Netherlands</div>
          </div>
        </div>
      </div>

      <div class="form-group">
        <label class="field-label">City</label>
        <div id="city" class="select-dropdown" data-cy="cityDropdown">
          <div class="select-control" data-cy="cityControl">
            <span id="city-display" data-cy="cityDisplay" class="select-placeholder">Select City</span>
            <span class="select-arrow">&#9660;</span>
          </div>
          <div class="select-menu" id="city-menu" data-cy="cityMenu" style="display:none;"></div>
        </div>
      </div>
    </div>

    <button type="button" id="submit" data-cy="submitBtn">Submit</button>
  </form>

  <!-- Success modal -->
  <div class="modal-overlay" id="success-modal" data-cy="successModal" style="display:none;">
    <div class="modal-dialog">
      <div class="modal-content" data-cy="modalContent">
        <div class="modal-header">
          <h2 data-cy="modalTitle">Thanks for submitting the form</h2>
        </div>
        <div class="modal-body">
          <table data-cy="resultTable">
            <tbody id="result-tbody"></tbody>
          </table>
        </div>
        <div class="modal-footer">
          <button data-cy="closeModalBtn">Close</button>
        </div>
      </div>
    </div>
  </div>

  <script src="js/form.js"></script>
</body>
</html>
