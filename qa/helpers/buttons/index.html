<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Buttons</title>
  <link rel="stylesheet" href="css/buttons.css" />
</head>
<body>
  <h1>Buttons</h1>

  <div class="buttonsWrapper">
    <div class="buttonSection">
      <button id="doubleClickBtn" data-cy="doubleClickBtn">Double Click Me</button>
      <p id="doubleClickMessage" class="resultMessage" data-cy="doubleClickMessage">You have done a double click</p>
    </div>

    <div class="buttonSection">
      <button id="rightClickBtn" data-cy="rightClickBtn">Right Click Me</button>
      <p id="rightClickMessage" class="resultMessage" data-cy="rightClickMessage">You have done a right click</p>
    </div>

    <div class="buttonSection">
      <p id="dynamicClickMessage" class="resultMessage" data-cy="dynamicClickMessage">You have done a dynamic click</p>
    </div>

    <div class="buttonSection">
      <button data-cy="dynamicClickBtn">Click Me</button>
    </div>
  </div>

  <script src="js/buttons.js"></script>
</body>
</html>
